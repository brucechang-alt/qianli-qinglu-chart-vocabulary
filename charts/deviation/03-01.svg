<?xml version='1.0' encoding='utf-8'?>
<svg class="chart-svg" role="img" aria-labelledby="t-发散条形图示例 d-发散条形图示例" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" width="360" height="190">
  <style>:root{--paper:#f3e6c6;--ink:#28231b;--muted:#736249;--rule:#c4a971;--cinnabar:#c44530;--stone-blue:#006f91;--stone-green:#2f8456;--ochre:#b97a12}
text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:var(--ink)}
.label,.value,.value-light,.big-value,.note,.tick,.axis-title{font-size:12px}
.value,.big-value{font-weight:700;font-variant-numeric:tabular-nums}.big-value{font-size:18px}
.value-light{font-weight:700;fill:var(--paper)}.tick,.axis-title{fill:var(--muted)}
.axis{stroke:var(--rule);stroke-width:1}.grid{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 4;opacity:.72}
.red{stroke:var(--cinnabar);stroke-width:2.5}.blue{stroke:var(--stone-blue);stroke-width:2.5}.green{stroke:var(--stone-green);stroke-width:2.5}.gold{stroke:var(--ochre);stroke-width:2.5}</style>
  <title id="t-发散条形图示例">发散条形图示例</title>
  <desc id="d-发散条形图示例">四个类别围绕零线向左右展开。</desc>
  <line x1="180" y1="20" x2="180" y2="166" class="zero"/>
  <rect x="77.6" y="30" width="102.4" height="18" fill="#c44530"/>
  <text x="174" y="43" class="value" text-anchor="end">-32</text>
  <text x="70" y="43" class="label" text-anchor="end">住房</text>
  <rect x="122.4" y="64" width="57.6" height="18" fill="#c44530"/>
  <text x="174" y="77" class="value" text-anchor="end">-18</text>
  <text x="70" y="77" class="label" text-anchor="end">交通</text>
  <rect x="180" y="98" width="44.800000000000004" height="18" fill="#006f91"/>
  <text x="186" y="111" class="value" text-anchor="start">+14</text>
  <text x="290" y="111" class="label" text-anchor="start">医疗</text>
  <rect x="180" y="132" width="92.80000000000001" height="18" fill="#006f91"/>
  <text x="186" y="145" class="value" text-anchor="start">+29</text>
  <text x="290" y="145" class="label" text-anchor="start">教育</text>
</svg>
