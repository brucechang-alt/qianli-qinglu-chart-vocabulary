  <path d="M42,94 L42,148 L69,130 L96,109 L123,82 L123,94 Z M204,94 L204,67 L231,103 L258,127 L285,115 L285,94 Z" fill="#f09a78" stroke="#e14b32" stroke-width="1.5"/>
  <path d="M123,94 L123,82 L150,58 L177,40 L204,67 L204,94 Z M285,94 L285,115 L312,76 L339,52 L339,94 Z" fill="#d5f2e6" stroke="#007ea7" stroke-width="1.5"/>
