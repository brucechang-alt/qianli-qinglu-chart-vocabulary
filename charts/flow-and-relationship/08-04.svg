<?xml version='1.0' encoding='utf-8'?>
<svg class="chart-svg" role="img" aria-labelledby="t-网络关系图示例 d-网络关系图示例" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" width="360" height="190">
  <style>:root{--paper:#f3e6c6;--ink:#28231b;--muted:#736249;--rule:#c4a971;--cinnabar:#c44530;--stone-blue:#006f91;--stone-green:#2f8456;--ochre:#b97a12}
text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:var(--ink)}
.label,.value,.value-light,.big-value,.note,.tick,.axis-title{font-size:12px}
.value,.big-value{font-weight:700;font-variant-numeric:tabular-nums}.big-value{font-size:18px}
.value-light{font-weight:700;fill:var(--paper)}.tick,.axis-title{fill:var(--muted)}
.axis{stroke:var(--rule);stroke-width:1}.grid{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 4;opacity:.72}
.red{stroke:var(--cinnabar);stroke-width:2.5}.blue{stroke:var(--stone-blue);stroke-width:2.5}.green{stroke:var(--stone-green);stroke-width:2.5}.gold{stroke:var(--ochre);stroke-width:2.5}</style>
  <title id="t-网络关系图示例">网络关系图示例</title>
  <desc id="d-网络关系图示例">节点与边呈现群落、中心与桥梁，不默认表示流量。</desc>
  <line x1="70" y1="90" x2="120" y2="48" class="" stroke="#c4a971" stroke-width="1.5"/>
  <line x1="70" y1="90" x2="128" y2="132" class="" stroke="#c4a971" stroke-width="1.5"/>
  <line x1="120" y1="48" x2="185" y2="92" class="" stroke="#c4a971" stroke-width="1.5"/>
  <line x1="128" y1="132" x2="185" y2="92" class="" stroke="#c4a971" stroke-width="1.5"/>
  <line x1="185" y1="92" x2="240" y2="45" class="" stroke="#c4a971" stroke-width="1.5"/>
  <line x1="185" y1="92" x2="250" y2="132" class="" stroke="#c4a971" stroke-width="1.5"/>
  <line x1="240" y1="45" x2="309" y2="88" class="" stroke="#c4a971" stroke-width="1.5"/>
  <line x1="250" y1="132" x2="309" y2="88" class="" stroke="#c4a971" stroke-width="1.5"/>
  <line x1="120" y1="48" x2="240" y2="45" class="" stroke="#e48f75" stroke-width="2.5"/>
  <line x1="128" y1="132" x2="250" y2="132" class="" stroke="#e48f75" stroke-width="2.5"/>
  <circle cx="70" cy="90" r="9" fill="#006f91"/>
  <text x="70" y="94" class="value-light" text-anchor="middle">A</text>
  <circle cx="120" cy="48" r="9" fill="#006f91"/>
  <text x="120" y="52" class="value-light" text-anchor="middle">B</text>
  <circle cx="128" cy="132" r="9" fill="#2f8456"/>
  <text x="128" y="136" class="value-light" text-anchor="middle">C</text>
  <circle cx="185" cy="92" r="13" fill="#c44530"/>
  <text x="185" y="96" class="value-light" text-anchor="middle">D</text>
  <circle cx="240" cy="45" r="9" fill="#b97a12"/>
  <text x="240" y="49" class="value-light" text-anchor="middle">E</text>
  <circle cx="250" cy="132" r="9" fill="#704c99"/>
  <text x="250" y="136" class="value-light" text-anchor="middle">F</text>
  <circle cx="309" cy="88" r="9" fill="#704c99"/>
  <text x="309" y="92" class="value-light" text-anchor="middle">G</text>
  <text x="185" y="117" class="note" text-anchor="middle">桥梁节点</text>
</svg>
