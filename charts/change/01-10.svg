<?xml version='1.0' encoding='utf-8'?>
<svg class="chart-svg" role="img" aria-labelledby="t-Priestley时间带示例 d-Priestley时间带示例" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" width="360" height="190">
  <style>:root{--paper:#f3e6c6;--ink:#28231b;--muted:#736249;--rule:#c4a971;--cinnabar:#c44530;--stone-blue:#006f91;--stone-green:#2f8456;--ochre:#b97a12}
text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:var(--ink)}
.label,.value,.value-light,.big-value,.note,.tick,.axis-title{font-size:12px}
.value,.big-value{font-weight:700;font-variant-numeric:tabular-nums}.big-value{font-size:18px}
.value-light{font-weight:700;fill:var(--paper)}.tick,.axis-title{fill:var(--muted)}
.axis{stroke:var(--rule);stroke-width:1}.grid{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 4;opacity:.72}
.red{stroke:var(--cinnabar);stroke-width:2.5}.blue{stroke:var(--stone-blue);stroke-width:2.5}.green{stroke:var(--stone-green);stroke-width:2.5}.gold{stroke:var(--ochre);stroke-width:2.5}</style>
  <title id="t-Priestley时间带示例">Priestley时间带示例</title>
  <desc id="d-Priestley时间带示例">多个事件以横向长度显示持续期和重叠。</desc>
  <line x1="42" y1="160" x2="338" y2="160" class="axis"/>
  <rect x="48" y="23" width="84" height="22" fill="#006f91" rx="2"/>
  <text x="54" y="38" class="value-light" text-anchor="start">项目甲</text>
  <rect x="80" y="48" width="130" height="22" fill="#e48f75" rx="2"/>
  <text x="86" y="63" class="value" text-anchor="start">调查乙</text>
  <rect x="150" y="73" width="150" height="22" fill="#2f8456" rx="2"/>
  <text x="156" y="88" class="value-light" text-anchor="start">审理丙</text>
  <rect x="65" y="98" width="107" height="22" fill="#b97a12" rx="2"/>
  <text x="71" y="113" class="value-light" text-anchor="start">行动丁</text>
  <rect x="230" y="123" width="100" height="22" fill="#704c99" rx="2"/>
  <text x="236" y="138" class="value-light" text-anchor="start">计划戊</text>
  <text x="42" y="180" class="axis-title" text-anchor="start">开始</text>
  <text x="338" y="180" class="axis-title" text-anchor="end">结束</text>
</svg>
