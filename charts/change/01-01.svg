  <text x="189" y="184" class="axis-title" text-anchor="middle" data-axis="x">月份</text>
  <text x="12" y="90" class="axis-title" text-anchor="middle" transform="rotate(-90 12 90)" data-axis="y">指数</text>
  <polyline points="44,95.6 70,90.5 96,92.2 122,80.3 148,75.2 174,78.60000000000001 200,65 226,58.2 252,63.3 278,49.7 304,42.900000000000006 330,34.400000000000006" fill="none" stroke="#007ea7" stroke-width="3"/>
  <circle cx="44" cy="95.6" r="2.5" fill="#007ea7"/>
  <circle cx="70" cy="90.5" r="2.5" fill="#007ea7"/>
  <circle cx="96" cy="92.2" r="2.5" fill="#007ea7"/>
  <circle cx="122" cy="80.3" r="2.5" fill="#007ea7"/>
  <circle cx="148" cy="75.2" r="2.5" fill="#007ea7"/>
  <circle cx="174" cy="78.60000000000001" r="2.5" fill="#007ea7"/>
  <circle cx="200" cy="65" r="2.5" fill="#007ea7"/>
  <circle cx="226" cy="58.2" r="2.5" fill="#007ea7"/>
  <circle cx="252" cy="63.3" r="2.5" fill="#007ea7"/>
  <circle cx="278" cy="49.7" r="2.5" fill="#007ea7"/>
  <circle cx="304" cy="42.900000000000006" r="2.5" fill="#007ea7"/>
  <circle cx="330" cy="34.400000000000006" r="5" fill="#e14b32"/>
