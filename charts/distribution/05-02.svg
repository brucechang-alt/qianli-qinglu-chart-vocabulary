<?xml version='1.0' encoding='utf-8'?>
<svg class="chart-svg" role="img" aria-labelledby="t-箱线图示例 d-箱线图示例" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" width="360" height="190">
  <style>:root{--paper:#faf2d9;--ink:#1c211d;--muted:#625c4d;--rule:#cdbd8f;--cinnabar:#e14b32;--stone-blue:#007ea7;--stone-green:#259b62;--ochre:#d99a16}
text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:var(--ink)}
.label,.value,.value-light,.big-value,.note,.tick,.axis-title{font-size:12px}
.value,.big-value{font-weight:700;font-variant-numeric:tabular-nums}.big-value{font-size:18px}
.value-light{font-weight:700;fill:var(--paper)}.tick,.axis-title{fill:var(--muted)}
.axis{stroke:var(--rule);stroke-width:1}.grid{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 4;opacity:.72}
.red{stroke:var(--cinnabar);stroke-width:2.5}.blue{stroke:var(--stone-blue);stroke-width:2.5}.green{stroke:var(--stone-green);stroke-width:2.5}.gold{stroke:var(--ochre);stroke-width:2.5}</style>
  <title id="t-箱线图示例">箱线图示例</title>
  <desc id="d-箱线图示例">三组数据共享轴，显示中位数、四分位和异常点。</desc>
  <line x1="38" y1="158" x2="340" y2="158" class="axis"/>
  <line x1="38" y1="20" x2="38" y2="158" class="axis"/>
  <text x="189" y="184" class="axis-title" text-anchor="middle" data-axis="x">观察值</text>
  <line x1="68" y1="55" x2="296" y2="55" class="stem"/>
  <line x1="68" y1="47" x2="68" y2="63" class="stem"/>
  <line x1="296" y1="47" x2="296" y2="63" class="stem"/>
  <rect x="118" y="41" width="116" height="28" fill="#d5f2e6" stroke="#007ea7" stroke-width="2"/>
  <line x1="166" y1="41" x2="166" y2="69" class="zero"/>
  <text x="42" y="59" class="label" text-anchor="end">甲</text>
  <line x1="78" y1="98" x2="291" y2="98" class="stem"/>
  <line x1="78" y1="90" x2="78" y2="106" class="stem"/>
  <line x1="291" y1="90" x2="291" y2="106" class="stem"/>
  <rect x="126" y="84" width="115" height="28" fill="#d5f2e6" stroke="#007ea7" stroke-width="2"/>
  <line x1="182" y1="84" x2="182" y2="112" class="zero"/>
  <text x="42" y="102" class="label" text-anchor="end">乙</text>
  <line x1="88" y1="141" x2="286" y2="141" class="stem"/>
  <line x1="88" y1="133" x2="88" y2="149" class="stem"/>
  <line x1="286" y1="133" x2="286" y2="149" class="stem"/>
  <rect x="134" y="127" width="114" height="28" fill="#d5f2e6" stroke="#007ea7" stroke-width="2"/>
  <line x1="198" y1="127" x2="198" y2="155" class="zero"/>
  <text x="42" y="145" class="label" text-anchor="end">丙</text>
  <circle cx="320" cy="141" r="4" fill="#faf2d9" stroke="#e14b32" stroke-width="2"/>
</svg>
