<?xml version='1.0' encoding='utf-8'?>
<svg class="chart-svg" role="img" aria-labelledby="t-累积分布曲线示例 d-累积分布曲线示例" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" width="360" height="190">
  <style>:root{--paper:#f3e6c6;--ink:#28231b;--muted:#736249;--rule:#c4a971;--cinnabar:#c44530;--stone-blue:#006f91;--stone-green:#2f8456;--ochre:#b97a12}
