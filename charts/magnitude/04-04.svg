<?xml version='1.0' encoding='utf-8'?>
<svg class="chart-svg" role="img" aria-labelledby="t-成对条形图示例 d-成对条形图示例" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" width="360" height="190">
  <style>:root{--paper:#faf2d9;--ink:#1c211d;--muted:#625c4d;--rule:#cdbd8f;--cinnabar:#e14b32;--stone-blue:#007ea7;--stone-green:#259b62;--ochre:#d99a16}
text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:var(--ink)}
.label,.value,.value-light,.big-value,.note,.tick,.axis-title{font-size:12px}
.value,.big-value{font-weight:700;font-variant-numeric:tabular-nums}.big-value{font-size:18px}
.value-light{font-weight:700;fill:var(--paper)}.tick,.axis-title{fill:var(--muted)}
.axis{stroke:var(--rule);stroke-width:1}.grid{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 4;opacity:.72}
.red{stroke:var(--cinnabar);stroke-width:2.5}.blue{stroke:var(--stone-blue);stroke-width:2.5}.green{stroke:var(--stone-green);stroke-width:2.5}.gold{stroke:var(--ochre);stroke-width:2.5}</style>
  <title id="t-成对条形图示例">成对条形图示例</title>
  <desc id="d-成对条形图示例">每个长标签类别用上下两条比较。</desc>
  <line x1="38" y1="158" x2="340" y2="158" class="axis"/>
  <line x1="38" y1="20" x2="38" y2="158" class="axis"/>
  <text x="189" y="184" class="axis-title" text-anchor="middle" data-axis="x">数量</text>
  <text x="35" y="36" class="label" text-anchor="end">甲组</text>
  <rect x="43" y="25" width="134.4" height="8" fill="#007ea7"/>
  <rect x="43" y="35" width="185.60000000000002" height="8" fill="#f09a78"/>
  <text x="35" y="61" class="label" text-anchor="end">乙组</text>
  <rect x="43" y="50" width="176" height="8" fill="#007ea7"/>
  <rect x="43" y="60" width="156.8" height="8" fill="#f09a78"/>
  <text x="35" y="86" class="label" text-anchor="end">丙组</text>
  <rect x="43" y="75" width="121.60000000000001" height="8" fill="#007ea7"/>
  <rect x="43" y="85" width="166.4" height="8" fill="#f09a78"/>
  <text x="35" y="111" class="label" text-anchor="end">丁组</text>
  <rect x="43" y="100" width="195.20000000000002" height="8" fill="#007ea7"/>
  <rect x="43" y="110" width="217.60000000000002" height="8" fill="#f09a78"/>
  <text x="35" y="136" class="label" text-anchor="end">戊组</text>
  <rect x="43" y="125" width="150.4" height="8" fill="#007ea7"/>
  <rect x="43" y="135" width="188.8" height="8" fill="#f09a78"/>
</svg>
