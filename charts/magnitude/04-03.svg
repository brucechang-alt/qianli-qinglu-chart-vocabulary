<?xml version='1.0' encoding='utf-8'?>
<svg class="chart-svg" role="img" aria-labelledby="t-成对柱形图示例 d-成对柱形图示例" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" width="360" height="190">
  <style>:root{--paper:#f3e6c6;--ink:#28231b;--muted:#736249;--rule:#c4a971;--cinnabar:#c44530;--stone-blue:#006f91;--stone-green:#2f8456;--ochre:#b97a12}
text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:var(--ink)}
.label,.value,.value-light,.big-value,.note,.tick,.axis-title{font-size:12px}
.value,.big-value{font-weight:700;font-variant-numeric:tabular-nums}.big-value{font-size:18px}
.value-light{font-weight:700;fill:var(--paper)}.tick,.axis-title{fill:var(--muted)}
.axis{stroke:var(--rule);stroke-width:1}.grid{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 4;opacity:.72}
.red{stroke:var(--cinnabar);stroke-width:2.5}.blue{stroke:var(--stone-blue);stroke-width:2.5}.green{stroke:var(--stone-green);stroke-width:2.5}.gold{stroke:var(--ochre);stroke-width:2.5}</style>
  <title id="t-成对柱形图示例">成对柱形图示例</title>
  <desc id="d-成对柱形图示例">每个类别并列两项同单位数值。</desc>
  <line x1="38" y1="158" x2="340" y2="158" class="axis"/>
  <line x1="38" y1="20" x2="38" y2="158" class="axis"/>
  <text x="189" y="184" class="axis-title" text-anchor="middle" data-axis="x">类别</text>
  <text x="12" y="90" class="axis-title" text-anchor="middle" transform="rotate(-90 12 90)" data-axis="y">数量</text>
  <rect x="54" y="90.8" width="17" height="67.2" fill="#006f91"/>
  <rect x="73" y="65.19999999999999" width="17" height="92.80000000000001" fill="#e48f75"/>
  <text x="72" y="176" class="tick" text-anchor="middle">甲</text>
  <rect x="110" y="70" width="17" height="88" fill="#006f91"/>
  <rect x="129" y="79.6" width="17" height="78.4" fill="#e48f75"/>
  <text x="128" y="176" class="tick" text-anchor="middle">乙</text>
  <rect x="166" y="97.19999999999999" width="17" height="60.800000000000004" fill="#006f91"/>
  <rect x="185" y="74.8" width="17" height="83.2" fill="#e48f75"/>
  <text x="184" y="176" class="tick" text-anchor="middle">丙</text>
  <rect x="222" y="60.39999999999999" width="17" height="97.60000000000001" fill="#006f91"/>
  <rect x="241" y="49.19999999999999" width="17" height="108.80000000000001" fill="#e48f75"/>
  <text x="240" y="176" class="tick" text-anchor="middle">丁</text>
  <rect x="278" y="82.8" width="17" height="75.2" fill="#006f91"/>
  <rect x="297" y="63.599999999999994" width="17" height="94.4" fill="#e48f75"/>
  <text x="296" y="176" class="tick" text-anchor="middle">戊</text>
  <rect x="234" y="18" width="12" height="8" fill="#006f91"/>
  <text x="250" y="26" class="note" text-anchor="start">A</text>
  <rect x="280" y="18" width="12" height="8" fill="#e48f75"/>
  <text x="296" y="26" class="note" text-anchor="start">B</text>
</svg>
